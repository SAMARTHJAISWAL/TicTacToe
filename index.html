<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="msg-container hide" role="dialog" aria-labelledby="msg">
      <p id="msg" aria-live="polite">Winner</p>
      <button type="button" id="new-btn">New Game</button>
    </div>
    <main>
      <h1>Tic Tac Toe</h1>
      <p id="turn" aria-live="polite">Turn: O</p>
      <div class="container">
        <div class="game" role="group" aria-label="Tic Tac Toe board">
          <button type="button" class="box" aria-label="Row 1, column 1, empty"></button>
          <button type="button" class="box" aria-label="Row 1, column 2, empty"></button>
          <button type="button" class="box" aria-label="Row 1, column 3, empty"></button>
          <button type="button" class="box" aria-label="Row 2, column 1, empty"></button>
          <button type="button" class="box" aria-label="Row 2, column 2, empty"></button>
          <button type="button" class="box" aria-label="Row 2, column 3, empty"></button>
          <button type="button" class="box" aria-label="Row 3, column 1, empty"></button>
          <button type="button" class="box" aria-label="Row 3, column 2, empty"></button>
          <button type="button" class="box" aria-label="Row 3, column 3, empty"></button>
        </div>
      </div>
      <button type="button" id="reset-btn">Reset Game</button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
